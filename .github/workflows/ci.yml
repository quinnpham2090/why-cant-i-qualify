name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-compliance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compliance copy-lint (forbidden-word gate)
        run: npm run copy-lint

      - name: Unit tests (diagnostic engine)
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Type-check + build
        run: npm run build
